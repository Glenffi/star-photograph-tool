# Include these locations inside the HTTPS server block for di.nexusgen.net.
# Files live below /www/wwwroot/starprocessor and are maintained by
# scripts/publish-update.sh.

location = /starprocessor {
    return 308 /starprocessor/;
}

location = /starprocessor/ {
    root /www/wwwroot;
    try_files /starprocessor/index.html =404;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    limit_except GET HEAD { deny all; }
}

location ^~ /starprocessor/assets/ {
    root /www/wwwroot;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}

location = /starprocessor/update.json {
    root /www/wwwroot;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}

location ^~ /starprocessor/downloads/ {
    root /www/wwwroot;
    default_type application/octet-stream;
    autoindex off;
    add_header Cache-Control "public, max-age=3600, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}
